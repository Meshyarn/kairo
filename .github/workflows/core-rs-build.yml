name: core-rs build

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/core-rs/**"
      - ".github/workflows/core-rs-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install core-rs deps
        run: npm install
        working-directory: crates/core-rs
      - name: Build core-rs
        run: npm run build
        working-directory: crates/core-rs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-rs-${{ matrix.os }}
          path: crates/core-rs/core_rs.node
