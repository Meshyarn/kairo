[package]
name = "core-rs"
version = "0.6.3"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.5", features = ["napi6"] }
napi-derive = "2.16.5"
tokenizers = "0.15.2"
similar = "2.6.0"
tree-sitter = "0.24.4"
tree-sitter-javascript = "0.23.0"
tree-sitter-typescript = "0.23.0"
tantivy = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fs2 = "0.4.3"

[build-dependencies]
napi-build = "2.1.2"

[patch.crates-io]
zstd-safe = { path = "vendor/zstd-safe" }
